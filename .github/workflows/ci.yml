name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit and render tests, package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  browser:
    name: Accessibility, interaction and visual tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run gallery
      # Ubuntu 24.04 runners forbid unprivileged user namespaces through AppArmor, and Chrome's
      # sandbox needs them. Lifting that restriction on the throwaway runner keeps the sandbox on,
      # so the tests run Chrome as readers do; --no-sandbox would test a weaker browser instead.
      - name: Allow Chrome's sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: npm run test:browser
      - name: Keep visual diffs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-output
          path: test/browser/__output__/
          if-no-files-found: ignore
